<?xml version="1.0" encoding="UTF-8"?>
<!-- Six MarraUp money-tree icon options. Each cell is 512×512 (Google Play size). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3EF"/>
    </linearGradient>
    <clipPath id="cell-0"><rect x="0" y="0" width="512" height="512"/></clipPath>
    <clipPath id="cell-1"><rect x="512" y="0" width="512" height="512"/></clipPath>
    <clipPath id="cell-2"><rect x="0" y="512" width="512" height="512"/></clipPath>
    <clipPath id="cell-3"><rect x="512" y="512" width="512" height="512"/></clipPath>
    <clipPath id="cell-4"><rect x="0" y="1024" width="512" height="512"/></clipPath>
    <clipPath id="cell-5"><rect x="512" y="1024" width="512" height="512"/></clipPath>
  </defs>

  <rect width="1024" height="1536" fill="#E7E5E4"/>
  <text x="512" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#57534E">MONEY TREE — PICK A NUMBER (512 × 512 EACH)</text>

  <!-- ========== 1: Silhouette canopy (single shape, 3 coin cutouts) ========== -->
  <g clip-path="url(#cell-0)">
    <rect width="512" height="512" fill="url(#g1)"/>
    <g transform="translate(256, 280)">
      <path d="M0 120 V40 C0 10 28 -20 0 -80 C-28 -20 0 10 0 40 V120 H-22 V120 H22 V120 Z" fill="#1C1917"/>
      <path d="M0 -95 C-95 -75 -110 10 0 55 C110 10 95 -75 0 -95 Z" fill="#1E40AF"/>
      <circle cx="-38" cy="-15" r="22" fill="#F5F3EF"/>
      <circle cx="42" cy="-25" r="18" fill="#F5F3EF"/>
      <circle cx="0" cy="-55" r="20" fill="#F5F3EF"/>
    </g>
    <g transform="translate(44, 44)">
      <circle r="28" fill="#1E40AF"/>
      <text y="9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">1</text>
    </g>
    <text x="256" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#78716C">Silhouette + coin cutouts</text>
  </g>

  <!-- ========== 2: Line art (ink tree, one gold-slate coin) ========== -->
  <g clip-path="url(#cell-1)">
    <rect x="512" width="512" height="512" fill="#FFFFFF"/>
    <g transform="translate(768, 300)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 130 V50" stroke="#1C1917" stroke-width="14"/>
      <path d="M0 50 L-70 -30 M0 50 L0 -70 M0 50 L70 -30" stroke="#1C1917" stroke-width="8"/>
      <path d="M-70 -30 Q-20 -90 0 -70 Q20 -90 70 -30" stroke="#1E40AF" stroke-width="6"/>
    </g>
    <circle cx="768" cy="168" r="40" fill="#EFF6FF" stroke="#1E40AF" stroke-width="5"/>
    <circle cx="768" cy="168" r="26" fill="none" stroke="#BFDBFE" stroke-width="2"/>
    <g transform="translate(556, 44)">
      <circle r="28" fill="#1E40AF"/>
      <text y="9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">2</text>
    </g>
    <text x="768" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#78716C">Line art, single coin crown</text>
  </g>

  <!-- ========== 3: Coin pot (stack base, sprout tree) ========== -->
  <g clip-path="url(#cell-2)">
    <rect y="512" width="512" height="512" fill="#F5F3EF"/>
    <g transform="translate(256, 340)">
      <ellipse cx="0" cy="48" rx="72" ry="16" fill="#D6D3D1"/>
      <rect x="-56" y="8" width="112" height="44" rx="8" fill="#1D4ED8"/>
      <rect x="-48" y="16" width="96" height="28" rx="6" fill="#1E40AF"/>
      <rect x="-40" y="24" width="80" height="12" rx="4" fill="#EFF6FF" opacity="0.6"/>
      <path d="M0 8 V-100 C-4 -130 4 -150 0 -180 C-4 -150 4 -130 0 -100 V8" fill="#57534E"/>
      <circle cx="0" cy="-195" r="32" fill="#1E40AF"/>
      <circle cx="-48" cy="-165" r="22" fill="#1D4ED8"/>
      <circle cx="48" cy="-165" r="22" fill="#1D4ED8"/>
      <circle cx="0" cy="-225" r="24" fill="#1D4ED8"/>
    </g>
    <g transform="translate(44, 556)">
      <circle r="28" fill="#1E40AF"/>
      <text y="9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">3</text>
    </g>
    <text x="256" y="990" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#78716C">Sprout from coin stack</text>
  </g>

  <!-- ========== 4: Ring canopy (trunk through coin ring) ========== -->
  <g clip-path="url(#cell-3)">
    <rect x="512" y="512" width="512" height="512" fill="#FFFFFF"/>
    <g transform="translate(768, 290)">
      <rect x="-16" y="20" width="32" height="130" rx="8" fill="#57534E"/>
      <circle r="95" fill="none" stroke="#1E40AF" stroke-width="28"/>
      <circle r="62" fill="#EFF6FF"/>
      <circle r="95" fill="none" stroke="#1D4ED8" stroke-width="4"/>
      <rect x="-16" y="-75" width="32" height="95" fill="#57534E"/>
    </g>
    <g transform="translate(556, 556)">
      <circle r="28" fill="#1E40AF"/>
      <text y="9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">4</text>
    </g>
    <text x="768" y="990" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#78716C">Coin ring canopy</text>
  </g>

  <!-- ========== 5: Triangle tree (3 coins as fruit, no $) ========== -->
  <g clip-path="url(#cell-4)">
    <rect y="1024" width="512" height="512" fill="#1C1917"/>
    <g transform="translate(256, 300)">
      <path d="M0 150 V70" stroke="#F5F3EF" stroke-width="18" stroke-linecap="round"/>
      <path d="M0 70 L-100 -80 L100 -80 Z" fill="#1E40AF"/>
      <path d="M0 70 L0 -80" stroke="#1D4ED8" stroke-width="4" opacity="0.5"/>
      <circle cx="-55" cy="-20" r="26" fill="#EFF6FF"/>
      <circle cx="55" cy="-20" r="26" fill="#EFF6FF"/>
      <circle cx="0" cy="-55" r="30" fill="#FFFFFF"/>
      <circle cx="0" cy="-55" r="30" fill="none" stroke="#BFDBFE" stroke-width="3"/>
    </g>
    <g transform="translate(44, 1068)">
      <circle r="28" fill="#FFFFFF"/>
      <text y="9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1E40AF">5</text>
    </g>
    <text x="256" y="1502" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#A8A29E">Dark bg, triangle + 3 coins</text>
  </g>

  <!-- ========== 6: Rounded app tile (minimal bush + 2 coins) ========== -->
  <g clip-path="url(#cell-5)">
    <rect x="512" y="1024" width="512" height="512" fill="#F5F3EF"/>
    <rect x="544" y="1056" width="448" height="448" rx="104" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
    <g transform="translate(768, 1180)">
      <path d="M0 200 V120" stroke="#57534E" stroke-width="20" stroke-linecap="round"/>
      <path d="M-90 120 Q0 20 90 120 Q0 60 -90 120 Z" fill="#1D4ED8"/>
      <path d="M-70 100 Q0 40 70 100 Q0 80 -70 100 Z" fill="#1E40AF"/>
      <circle cx="-45" cy="75" r="24" fill="#EFF6FF" stroke="#1E40AF" stroke-width="3"/>
      <circle cx="45" cy="65" r="28" fill="#EFF6FF" stroke="#1E40AF" stroke-width="3"/>
      <circle cx="0" cy="45" r="20" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3"/>
    </g>
    <g transform="translate(556, 1068)">
      <circle r="28" fill="#1E40AF"/>
      <text y="9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">6</text>
    </g>
    <text x="768" y="1502" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#78716C">Rounded tile, soft bush</text>
  </g>

  <!-- Grid lines -->
  <path d="M512 0 V1536 M0 512 H1024 M0 1024 H1024" stroke="#D6D3D1" stroke-width="2"/>
</svg>
