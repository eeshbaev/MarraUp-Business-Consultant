<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#F5F3EF"/>

  <text x="500" y="44" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#78716C">MARRAUP LOGO CONCEPTS</text>
  <text x="500" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#A8A29E">Stone background, slate blue marks, flat vector</text>

  <!-- Column width 200, centers 100, 300, 500, 700, 900 -->

  <!-- 1 THE GAP -->
  <g transform="translate(100, 100)">
    <rect x="-70" y="0" width="140" height="160" rx="10" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1"/>
    <rect x="-38" y="40" width="32" height="72" rx="4" fill="#1E40AF"/>
    <rect x="6" y="40" width="32" height="72" rx="4" fill="#1E40AF"/>
    <text y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">The Gap</text>
    <text y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">market void</text>
  </g>

  <!-- 2 MERIDIAN -->
  <g transform="translate(300, 100)">
    <rect x="-70" y="0" width="140" height="160" rx="10" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1"/>
    <circle cy="76" r="6" fill="#1E40AF"/>
    <line x1="0" y1="76" x2="0" y2="36" stroke="#1E40AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="76" x2="34" y2="92" stroke="#1E40AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="76" x2="-34" y2="92" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <text y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">Meridian</text>
    <text y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">survey benchmark</text>
  </g>

  <!-- 3 THREE-WAY FORK -->
  <g transform="translate(500, 100)">
    <rect x="-70" y="0" width="140" height="160" rx="10" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1"/>
    <path d="M0 108 V68 M0 68 L-28 38 M0 68 L0 32 M0 68 L28 38" stroke="#1E40AF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">Three-way Fork</text>
    <text y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">pick a direction</text>
  </g>

  <!-- 4 REGISTRY STAMP -->
  <g transform="translate(700, 100)">
    <rect x="-70" y="0" width="140" height="160" rx="10" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1"/>
    <rect x="-52" y="44" width="104" height="56" rx="5" fill="none" stroke="#1C1917" stroke-width="2.5"/>
    <rect x="-46" y="50" width="92" height="44" rx="3" fill="none" stroke="#1C1917" stroke-width="1" opacity="0.35"/>
    <text y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#1C1917">MARRAUP</text>
    <text y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1" fill="#78716C">VENTURE AND ASSESS</text>
    <text y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">Registry Stamp</text>
    <text y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">wordmark-led</text>
  </g>

  <!-- 5 WOVEN CROSS -->
  <g transform="translate(900, 100)">
    <rect x="-70" y="0" width="140" height="160" rx="10" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="1"/>
    <rect x="-8" y="36" width="16" height="56" fill="#1E40AF"/>
    <rect x="-28" y="56" width="56" height="16" fill="#1D4ED8"/>
    <rect x="-8" y="56" width="16" height="16" fill="#1E40AF"/>
    <text y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">Woven Cross</text>
    <text y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">research weave</text>
  </g>

  <!-- App icon row -->
  <text x="500" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#78716C">APP ICON PREVIEWS</text>

  <g transform="translate(100, 320)">
    <rect x="-36" y="0" width="72" height="72" rx="16" fill="#FFFFFF" stroke="#D6D3D1"/>
    <rect x="-22" y="20" width="14" height="32" rx="2" fill="#1E40AF"/>
    <rect x="-4" y="20" width="14" height="32" rx="2" fill="#1E40AF"/>
    <text y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#57534E">The Gap</text>
  </g>
  <g transform="translate(300, 320)">
    <rect x="-36" y="0" width="72" height="72" rx="16" fill="#FFFFFF" stroke="#D6D3D1"/>
    <circle cy="36" r="5" fill="#1E40AF"/>
    <line x1="0" y1="36" x2="0" y2="18" stroke="#1E40AF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="36" x2="16" y2="44" stroke="#1E40AF" stroke-width="2.5" stroke-linecap="round"/>
    <text y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#57534E">Meridian</text>
  </g>
  <g transform="translate(500, 320)">
    <rect x="-36" y="0" width="72" height="72" rx="16" fill="#FFFFFF" stroke="#D6D3D1"/>
    <path d="M0 52 V36 M0 36 L-14 22 M0 36 L0 18 M0 36 L14 22" stroke="#1E40AF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#57534E">Three-way Fork</text>
  </g>
  <g transform="translate(700, 320)">
    <rect x="-36" y="0" width="72" height="72" rx="16" fill="#1C1917"/>
    <text y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#F5F3EF">MU</text>
    <text y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#57534E">Registry Stamp</text>
  </g>
  <g transform="translate(900, 320)">
    <rect x="-36" y="0" width="72" height="72" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
    <rect x="-6" y="22" width="12" height="28" fill="#1E40AF"/>
    <rect x="-18" y="34" width="36" height="12" fill="#1D4ED8"/>
    <text y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#57534E">Woven Cross</text>
  </g>

  <g transform="translate(500, 460)">
    <rect x="-360" y="0" width="720" height="56" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <rect x="-332" y="14" width="12" height="28" rx="2" fill="#1E40AF"/>
    <rect x="-316" y="14" width="12" height="28" rx="2" fill="#1E40AF"/>
    <text x="-290" y="36" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#78716C">MARRAUP</text>
    <text x="340" y="36" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#57534E">Explore</text>
    <text y="78" text-anchor="middle" font-size="11" fill="#A8A29E">Header example: The Gap + wordmark</text>
  </g>
</svg>
